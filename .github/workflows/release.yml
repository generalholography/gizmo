name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run validate
      - run: npm run pack:dry-run

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build:package
      - run: npm publish --workspace=engine --access public --provenance
      - run: npm publish --workspace=mcp --access public --provenance
      - run: npm run build --workspace=cli
      - run: npm publish --workspace=cli --access public --provenance
      - uses: actions/upload-artifact@v4
        with:
          name: engine-browser-runtime
          path: engine/dist/browser
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
